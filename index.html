<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><meta name="theme-color" content="#111419"><title>iCare | Local Notes</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#111419;color:#f1f5fa}*{box-sizing:border-box}body{margin:0}.app{height:100dvh;max-width:1100px;margin:auto;display:flex;flex-direction:column;gap:12px;padding:14px}header{display:flex;align-items:center;justify-content:space-between;min-height:42px}.brand{font-weight:750;font-size:23px}.sub{font-size:12px;color:#aeb8c3}.output-panel{border:2px solid #8994a2;border-radius:19px;min-height:160px;flex:1;display:flex;flex-direction:column;overflow:hidden;background:#1d2229}.panel-head{padding:12px 15px;font-size:13px;color:#c2cbd5;display:flex;justify-content:space-between}#output{width:100%;flex:1;resize:none;background:transparent;border:0;color:#f5f7fa;padding:8px 16px 18px;font:15px/1.55 system-ui;outline:none}.composer{display:grid;grid-template-columns:minmax(0,1fr) 98px;gap:10px}.input-panel{border:2px solid #ff4b47;border-radius:17px;min-height:120px;display:flex;flex-direction:column;background:#1d2229}.input-label{font-size:13px;color:#ff9290;padding:10px 13px 0}#input{width:100%;min-height:85px;flex:1;resize:none;background:transparent;border:0;outline:0;color:white;padding:8px 12px;font:15px/1.5 system-ui}.copy{background:#27c75a;color:#081c0c;border:0;border-radius:17px;font-weight:800;font-size:16px}.send{grid-column:1/-1;background:#1685f9;border:0;color:white;border-radius:17px;min-height:52px;font-size:17px;font-weight:800}.copy:disabled{opacity:.4}.status{font-size:12px;color:#b5bfca;text-align:center;min-height:19px}.warning{font-size:11px;color:#e6c58e;text-align:center}button{cursor:pointer}button:focus-visible,textarea:focus-visible{outline:3px solid #fff;outline-offset:2px}@media(min-width:700px){.app{padding:25px;gap:18px}.composer{grid-template-columns:minmax(0,1fr) 120px}.input-panel{min-height:130px}#output{font-size:17px}}@media(max-height:600px){.app{gap:7px;padding:8px}.output-panel{min-height:100px}.input-panel{min-height:75px}#input{min-height:50px}}
 .review-flags{margin:0 12px 8px;border:1px solid #716247;border-radius:10px;background:#29271f;color:#f1dfb5;padding:7px 10px;font-size:12px}.review-flags summary{cursor:pointer;font-weight:700}.review-flags ul{margin:7px 0 3px;padding-left:20px;line-height:1.45}.review-flags[hidden]{display:none}</style><script type="module" src="./simple-app.mjs"></script></head><body><main class="app"><header><div><div class="brand">iCare</div><div class="sub">Local notes · On-device processing</div></div><div class="sub">Offline-ready</div></header><section class="output-panel" aria-label="Output"><div class="panel-head"><strong>Output</strong><span>Editable · Review before copying</span></div><details id="reviewFlags" class="review-flags" hidden><summary id="reviewSummary">Review notices</summary><ul id="reviewItems"></ul></details><textarea id="output" aria-label="Editable generated notes" placeholder="Your formatted support notes will appear here."></textarea></section><section class="composer"><div class="input-panel"><label class="input-label" for="input">Input</label><textarea id="input" placeholder="Type or paste shift notes here. First line: client name. Then shift observations…"></textarea></div><button class="copy" id="copy" type="button">Copy</button><button class="send" id="send" type="button">↵ &nbsp; Send / Enter</button></section><div class="status" id="status" role="status" aria-live="polite">Return adds a line · Blue button sends</div><div class="warning">Prototype: use fictional information only until approved for participant records.</div></main></body></html>
